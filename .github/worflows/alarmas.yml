name: Alarmas
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alarmas
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar alarmas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node alarmas.mjs
      - name: Guardar estado
        run: |
          git config user.name "alarmas-bot"
          git config user.email "alarmas-bot@users.noreply.github.com"
          git add alertas.json
          git diff --cached --quiet || (git commit -m "Actualiza alarmas" && git push)
