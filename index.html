<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Trading: prototipo</title>
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#14212b;--muted:#66767f;--grid:#e3e8e6;--line:#cfd7d4;--up:#12876f;--down:#c8453d;--amber:#b87a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--panel:#16212a;--ink:#e6edf1;--muted:#8c9ca6;--grid:#22303a;--line:#2d3d48;--up:#2cc4a6;--down:#ef6b62;--amber:#e0a63a}}
:root[data-theme="dark"]{--bg:#0e161c;--panel:#16212a;--ink:#e6edf1;--muted:#8c9ca6;--grid:#22303a;--line:#2d3d48;--up:#2cc4a6;--down:#ef6b62;--amber:#e0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
h1{font-size:17px;margin:0;font-weight:650}
#price{font-size:22px;font-weight:650}
#chg{font-size:13px;margin-left:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#c{height:330px}#r{height:120px;border-top:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--muted)}
input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:11px;border:0;border-radius:8px;font:inherit;font-weight:650;color:#fff;cursor:pointer}
.long{background:var(--up)}.short{background:var(--down)}.neutral{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-top:10px;font-size:14px}
.stats span{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
#msg{min-height:20px;font-size:13px;color:var(--amber);margin-top:6px}
ul{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--grid)}
.note{font-size:12px;color:var(--muted);margin:10px 2px}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
</style>
</head>
<body>
<main>
<header><h1>BTC/USDT simulado</h1><div><span id="price">–</span><span id="chg"></span></div></header>
<div class="row" id="tfs"></div>
<div class="row" id="inds"></div>
<div class="box"><div id="c"></div><div id="r"></div></div>
<div class="row"><button class="chip" id="play">Pausar</button></div>

<section class="panel">
<div class="grid">
<div><label for="cap">Capital inicial (USD)</label><input id="cap" type="number" value="1000" min="1"></div>
<div><label for="amt">Monto por operación (USD)</label><input id="amt" type="number" value="200" min="1"></div>
<div><label for="sl">Stop loss (%)</label><input id="sl" type="number" placeholder="Opcional" min="0" step="0.1"></div>
<div><label for="tp">Take profit (%)</label><input id="tp" type="number" placeholder="Opcional" min="0" step="0.1"></div>
</div>
<div class="grid" style="margin-top:10px">
<button class="btn long" id="buy">Comprar (largo)</button>
<button class="btn short" id="sell">Vender (corto)</button>
</div>
<div class="grid" style="margin-top:8px">
<button class="btn neutral" id="close">Cerrar posición</button>
<button class="btn neutral" id="reset">Reiniciar</button>
</div>
<div id="msg" role="status"></div>
<div class="stats">
<div><span>Saldo total</span><br><b id="eq">–</b></div>
<div><span>Posición abierta</span><br><b id="open">Ninguna</b></div>
<div><span>Operaciones</span><br><b id="nt">0</b></div>
<div><span>Aciertos</span><br><b id="wr">–</b></div>
</div>
<ul id="hist"></ul>
</section>
<p class="note">Los precios son simulados y se mueven solos, vela por vela. Comisión simulada: 0,1% por lado. En la siguiente fase se conectan los datos reales de Binance.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(n,d=2)=>n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const TF={'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1D':86400};
let tf='1m',paused=false;

/* Datos simulados: ~14 días de velas de 1 minuto */
const N=20000;let base=[],p=65000,t=Math.floor(Date.now()/60000)*60-N*60;
function nextCandle(){const o=p,r=(Math.random()-.5)*0.0016+(65000-p)/65000*0.0004;const c=o*(1+r);
 const b={time:t,open:o,high:Math.max(o,c)*(1+Math.random()*0.0006),low:Math.min(o,c)*(1-Math.random()*0.0006),close:c};p=c;t+=60;return b}
for(let i=0;i<N;i++)base.push(nextCandle());

function agg(s){const out=[];for(const b of base){const k=Math.floor(b.time/s)*s,l=out[out.length-1];
 if(l&&l.time===k){l.high=Math.max(l.high,b.high);l.low=Math.min(l.low,b.low);l.close=b.close}
 else out.push({time:k,open:b.open,high:b.high,low:b.low,close:b.close})}return out}

/* Indicadores */
const sma=(c,n)=>{const o=[];let s=0;c.forEach((x,i)=>{s+=x.close;if(i>=n)s-=c[i-n].close;if(i>=n-1)o.push({time:x.time,value:s/n})});return o};
const ema=(c,n)=>{const o=[],k=2/(n+1);let e=0;c.forEach((x,i)=>{if(i<n-1){e+=x.close/n;return}
 if(i===n-1){e+=x.close/n}else e=x.close*k+e*(1-k);o.push({time:x.time,value:e})});return o};
const bb=(c,n=20,m=2)=>{const u=[],mid=[],l=[];for(let i=n-1;i<c.length;i++){let s=0;for(let j=i-n+1;j<=i;j++)s+=c[j].close;const a=s/n;
 let v=0;for(let j=i-n+1;j<=i;j++)v+=(c[j].close-a)**2;const d=Math.sqrt(v/n)*m;u.push({time:c[i].time,value:a+d});mid.push({time:c[i].time,value:a});l.push({time:c[i].time,value:a-d})}return{u,mid,l}};
const rsi=(c,n=14)=>{const o=[];let g=0,l=0,ag=0,al=0;c.forEach((x,i)=>{if(i===0){o.push({time:x.time});return}
 const d=x.close-c[i-1].close,up=Math.max(d,0),dn=Math.max(-d,0);
 if(i<=n){g+=up;l+=dn;if(i===n){ag=g/n;al=l/n;o.push({time:x.time,value:al===0?100:100-100/(1+ag/al)})}else o.push({time:x.time})}
 else{ag=(ag*(n-1)+up)/n;al=(al*(n-1)+dn)/n;o.push({time:x.time,value:al===0?100:100-100/(1+ag/al)})}});return o};

/* Gráficos */
const themeOpts=()=>({layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted')},
 grid:{vertLines:{color:css('--grid')},horzLines:{color:css('--grid')}},
 rightPriceScale:{borderColor:css('--line')},timeScale:{borderColor:css('--line'),timeVisible:true,secondsVisible:false}});
const chart=LightweightCharts.createChart($('c'),{autoSize:true,...themeOpts()});
const rc=LightweightCharts.createChart($('r'),{autoSize:true,...themeOpts()});
const cs=chart.addCandlestickSeries();
const L=(col,w=1)=>chart.addLineSeries({color:col,lineWidth:w,priceLineVisible:false,lastValueVisible:false});
const sSma=L('#e0a63a',2),sEma=L('#4f8fdc',2),bU=L('#9b8bd6'),bM=L('#9b8bd6'),bL=L('#9b8bd6');
const sRsi=rc.addLineSeries({color:'#9b8bd6',lineWidth:2,priceLineVisible:false});
sRsi.createPriceLine({price:70,color:'#c8453d',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:''});
sRsi.createPriceLine({price:30,color:'#12876f',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:''});
function colors(){cs.applyOptions({upColor:css('--up'),downColor:css('--down'),borderUpColor:css('--up'),borderDownColor:css('--down'),wickUpColor:css('--up'),wickDownColor:css('--down')});
 chart.applyOptions(themeOpts());rc.applyOptions(themeOpts())}
colors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(colors,50));

let syncing=false;
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&!syncing){syncing=true;b.timeScale().setVisibleLogicalRange(r);syncing=false}});
link(chart,rc);link(rc,chart);

/* Indicadores activos */
const on={sma:true,ema:false,bb:false,rsi:true};
const defs=[['sma','Media 20'],['ema','Media 50'],['bb','Bollinger'],['rsi','RSI 14']];
function applyVis(){sSma.applyOptions({visible:on.sma});sEma.applyOptions({visible:on.ema});[bU,bM,bL].forEach(s=>s.applyOptions({visible:on.bb}));
 $('r').style.display=on.rsi?'block':'none';
 if(on.rsi)setTimeout(()=>{const r=chart.timeScale().getVisibleLogicalRange();if(r)rc.timeScale().setVisibleLogicalRange(r)},80)}
defs.forEach(([k,n])=>{const b=document.createElement('button');b.className='chip'+(on[k]?' on':'');b.textContent=n;
 b.onclick=()=>{on[k]=!on[k];b.classList.toggle('on',on[k]);applyVis()};$('inds').appendChild(b)});
Object.keys(TF).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===tf?' on':'');b.textContent=k;b.dataset.tf=k;
 b.onclick=()=>{tf=k;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('on',x.dataset.tf===k));load()};$('tfs').appendChild(b)});

let cands=[];
function load(){cands=agg(TF[tf]);cs.setData(cands);sSma.setData(sma(cands,20));sEma.setData(ema(cands,50));
 const b=bb(cands);bU.setData(b.u);bM.setData(b.mid);bL.setData(b.l);sRsi.setData(rsi(cands));
 const n=cands.length;chart.timeScale().setVisibleLogicalRange({from:n-90,to:n+6});applyVis();drawMarkers();drawLine()}

/* Simulador */
let realized=0,pos=null,hist=[],events=[],line=null;
const price=()=>base[base.length-1].close;
const bucket=s=>Math.floor(s/TF[tf])*TF[tf];
const msg=s=>{$('msg').textContent=s};
function drawMarkers(){cs.setMarkers(events.map(e=>({time:bucket(e.time),position:e.kind==='in'?(e.side>0?'belowBar':'aboveBar'):'inBar',
 color:e.kind==='in'?(e.side>0?css('--up'):css('--down')):css('--amber'),shape:e.kind==='in'?(e.side>0?'arrowUp':'arrowDown'):'circle',text:e.kind==='in'?(e.side>0?'Largo':'Corto'):'Salida'}))
 .sort((a,b)=>a.time-b.time))}
function drawLine(){if(line){cs.removePriceLine(line);line=null}if(pos)line=cs.createPriceLine({price:pos.entry,color:css('--amber'),lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Entrada'})}
function unreal(){return pos?pos.side*(price()-pos.entry)*pos.qty:0}
function open(side){if(pos){msg('Ya tienes una posición abierta. Ciérrala primero.');return}
 const a=parseFloat($('amt').value),eq=parseFloat($('cap').value)+realized;
 if(!(a>0)){msg('Escribe un monto válido.');return}if(a>eq){msg('El monto supera tu saldo disponible.');return}
 pos={side,entry:price(),qty:a/price(),amount:a};events.push({time:base[base.length-1].time,kind:'in',side});msg('');drawMarkers();drawLine();render()}
function closePos(why){if(!pos)return;const ex=price(),pnl=pos.side*(ex-pos.entry)*pos.qty-pos.amount*0.001*2;
 realized+=pnl;hist.unshift({side:pos.side,entry:pos.entry,exit:ex,pnl});events.push({time:base[base.length-1].time,kind:'out',side:pos.side});
 pos=null;msg(why||'');drawMarkers();drawLine();render()}
function render(){const u=unreal(),eq=parseFloat($('cap').value)+realized+u;
 $('eq').textContent='$'+fmt(eq);$('eq').className=eq>=parseFloat($('cap').value)?'up':'down';
 $('open').innerHTML=pos?(pos.side>0?'Largo':'Corto')+' <span class="'+(u>=0?'up':'down')+'">'+(u>=0?'+':'')+fmt(u)+'</span>':'Ninguna';
 $('nt').textContent=hist.length;const w=hist.filter(h=>h.pnl>0).length;$('wr').textContent=hist.length?fmt(w/hist.length*100,0)+'%':'–';
 $('hist').innerHTML=hist.slice(0,5).map(h=>'<li><span>'+(h.side>0?'Largo':'Corto')+' '+fmt(h.entry)+' → '+fmt(h.exit)+'</span><b class="'+(h.pnl>=0?'up':'down')+'">'+(h.pnl>=0?'+':'')+fmt(h.pnl)+'</b></li>').join('')}
$('buy').onclick=()=>open(1);$('sell').onclick=()=>open(-1);$('close').onclick=()=>{pos?closePos('Posición cerrada.'):msg('No hay posición abierta.')};
$('reset').onclick=()=>{realized=0;pos=null;hist=[];events=[];msg('Simulador reiniciado.');drawMarkers();drawLine();render()};
$('cap').oninput=render;
$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Reanudar':'Pausar'};

/* Avance en vivo (simulado) */
function tick(){if(paused)return;const nb=nextCandle();base.push(nb);
 const k=Math.floor(nb.time/TF[tf])*TF[tf],l=cands[cands.length-1];
 if(l.time===k){l.high=Math.max(l.high,nb.high);l.low=Math.min(l.low,nb.low);l.close=nb.close}else cands.push({time:k,open:nb.open,high:nb.high,low:nb.low,close:nb.close});
 const c=cands[cands.length-1];cs.update(c);
 const tail=cands.slice(-400),la=a=>a[a.length-1];
 sSma.update(la(sma(tail,20)));sEma.update(la(ema(tail,50)));const b=bb(tail);bU.update(la(b.u));bM.update(la(b.mid));bL.update(la(b.l));sRsi.update(la(rsi(tail)));
 const ref=base[base.length-1441].close,ch=(nb.close/ref-1)*100;
 $('price').textContent=fmt(nb.close);$('chg').textContent=(ch>=0?'+':'')+fmt(ch)+'%';$('chg').className=ch>=0?'up':'down';
 if(pos){const r=pos.side*(nb.close/pos.entry-1)*100,sl=parseFloat($('sl').value),tp=parseFloat($('tp').value);
  if(sl>0&&r<=-sl)closePos('Stop loss alcanzado.');else if(tp>0&&r>=tp)closePos('Take profit alcanzado.')}
 render()}
load();render();setInterval(tick,700);
</script>
</body>
</html>
