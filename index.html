<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Trading</title>
<style>
:root{--bg:#eef1ef;--panel:#fff;--ink:#14212b;--muted:#66767f;--grid:#e3e8e6;--line:#cfd7d4;--up:#12876f;--down:#c8453d;--amber:#b87a0a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161c;--panel:#16212a;--ink:#e6edf1;--muted:#8c9ca6;--grid:#22303a;--line:#2d3d48;--up:#2cc4a6;--down:#ef6b62;--amber:#e0a63a}}
:root[data-theme="dark"]{--bg:#0e161c;--panel:#16212a;--ink:#e6edf1;--muted:#8c9ca6;--grid:#22303a;--line:#2d3d48;--up:#2cc4a6;--down:#ef6b62;--amber:#e0a63a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:560px;margin:0 auto;padding:12px 12px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
select{font:inherit;font-size:17px;font-weight:650;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#price{font-size:22px;font-weight:650}
#chg{font-size:13px;margin-left:6px}
#st{font-size:12px;color:var(--muted);margin:0 2px 6px}
#st.err{color:var(--down)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#c{height:330px}#r{height:120px;border-top:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--muted)}
input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.btn{padding:12px;border:0;border-radius:8px;font:inherit;font-weight:650;color:#fff;cursor:pointer}
.long{background:var(--up)}.short{background:var(--down)}.neutral{background:var(--ink);color:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:50}
#hint{font-size:12px;color:var(--amber);min-height:16px;margin:0 2px 4px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-top:10px;font-size:14px}
.stats span{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
#msg{min-height:20px;font-size:13px;color:var(--amber);margin-top:8px}
ul{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
li{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--grid)}
.note{font-size:12px;color:var(--muted);margin:10px 2px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
</style>
</head>
<body>
<main>
<header>
<select id="sym" aria-label="Par"><option value="BTCUSDT">BTC/USDT</option><option value="ETHUSDT">ETH/USDT</option><option value="SOLUSDT">SOL/USDT</option><option value="BNBUSDT">BNB/USDT</option><option value="XRPUSDT">XRP/USDT</option></select>
<div><span id="price">–</span><span id="chg"></span></div>
</header>
<div id="st">Conectando…</div>
<div class="row" id="tfs"></div>
<div class="row" id="inds"></div>
<div class="row" id="tools"><button class="chip" data-tool="h">Horizontal</button><button class="chip" data-tool="t">Tendencia</button><button class="chip" id="undo">Deshacer</button><button class="chip" id="clr">Borrar todo</button></div>
<div id="hint"></div>
<div class="box"><div id="c"></div><div id="r"></div></div>

<section class="panel">
<div class="grid">
<div><label for="cap">Capital inicial (USD)</label><input id="cap" type="number" value="1000" min="1"></div>
<div><label for="amt">Monto por operación (USD)</label><input id="amt" type="number" value="200" min="1"></div>
<div><label for="sl">Stop loss (%)</label><input id="sl" type="number" placeholder="Opcional" min="0" step="0.1"></div>
<div><label for="tp">Take profit (%)</label><input id="tp" type="number" placeholder="Opcional" min="0" step="0.1"></div>
</div>
<div id="msg" role="status"></div>
<div class="stats">
<div><span>Saldo total</span><br><b id="eq">–</b></div>
<div><span>Posición abierta</span><br><b id="open">Ninguna</b></div>
<div><span>Operaciones</span><br><b id="nt">0</b></div>
<div><span>Aciertos</span><br><b id="wr">–</b></div>
</div>
<ul id="hist"></ul>
<button class="btn neutral" id="reset" style="margin-top:12px;width:100%">Reiniciar simulador</button>
</section>
<p class="note">Precios reales de Binance, con operaciones simuladas (sin dinero real). Comisión simulada: 0,1% por lado.</p>
</main>
<nav class="bar" aria-label="Operar">
<button class="btn long" id="buy">Largo</button>
<button class="btn short" id="sell">Corto</button>
<button class="btn neutral" id="close">Cerrar</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(n,d=2)=>n.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d});
const dp=n=>n>=100?2:n>=1?3:5;
const SEC={'1m':60,'5m':300,'15m':900,'1h':3600,'4h':14400,'1D':86400};
const IV={'1m':'1m','5m':'5m','15m':'15m','1h':'1h','4h':'4h','1D':'1d'};
const HOSTS=['https://data-api.binance.vision','https://api.binance.com'];
const WSS=['wss://data-stream.binance.vision/ws/','wss://stream.binance.com:9443/ws/'];
const off=-new Date().getTimezoneOffset()*60; /* hora local del celular */
let tf='1m',sym='BTCUSDT',cands=[],ws=null,loadId=0;

const status=(s,err)=>{$('st').textContent=s;$('st').className=err?'err':''};
async function api(path){for(const h of HOSTS){try{const r=await fetch(h+path);if(r.ok)return await r.json()}catch(e){}}throw new Error('sin conexión')}

/* Indicadores */
const sma=(c,n)=>{const o=[];let s=0;c.forEach((x,i)=>{s+=x.close;if(i>=n)s-=c[i-n].close;if(i>=n-1)o.push({time:x.time,value:s/n})});return o};
const ema=(c,n)=>{const o=[],k=2/(n+1);let e=0;c.forEach((x,i)=>{if(i<n-1){e+=x.close/n;return}
 if(i===n-1){e+=x.close/n}else e=x.close*k+e*(1-k);o.push({time:x.time,value:e})});return o};
const bb=(c,n=20,m=2)=>{const u=[],mid=[],l=[];for(let i=n-1;i<c.length;i++){let s=0;for(let j=i-n+1;j<=i;j++)s+=c[j].close;const a=s/n;
 let v=0;for(let j=i-n+1;j<=i;j++)v+=(c[j].close-a)**2;const d=Math.sqrt(v/n)*m;u.push({time:c[i].time,value:a+d});mid.push({time:c[i].time,value:a});l.push({time:c[i].time,value:a-d})}return{u,mid,l}};
const rsi=(c,n=14)=>{const o=[];let g=0,l=0,ag=0,al=0;c.forEach((x,i)=>{if(i===0){o.push({time:x.time});return}
 const d=x.close-c[i-1].close,up=Math.max(d,0),dn=Math.max(-d,0);
 if(i<=n){g+=up;l+=dn;if(i===n){ag=g/n;al=l/n;o.push({time:x.time,value:al===0?100:100-100/(1+ag/al)})}else o.push({time:x.time})}
 else{ag=(ag*(n-1)+up)/n;al=(al*(n-1)+dn)/n;o.push({time:x.time,value:al===0?100:100-100/(1+ag/al)})}});return o};

/* Gráficos */
const themeOpts=()=>({layout:{background:{type:'solid',color:css('--panel')},textColor:css('--muted')},
 grid:{vertLines:{color:css('--grid')},horzLines:{color:css('--grid')}},
 rightPriceScale:{borderColor:css('--line'),minimumWidth:64},timeScale:{borderColor:css('--line'),timeVisible:true,secondsVisible:false}});
const chart=LightweightCharts.createChart($('c'),{autoSize:true,...themeOpts()});
const rc=LightweightCharts.createChart($('r'),{autoSize:true,...themeOpts()});
const cs=chart.addCandlestickSeries();
const L=(col,w=1)=>chart.addLineSeries({color:col,lineWidth:w,priceLineVisible:false,lastValueVisible:false});
const sSma=L('#e0a63a',2),sEma=L('#4f8fdc',2),bU=L('#9b8bd6'),bM=L('#9b8bd6'),bL=L('#9b8bd6');
const sRsi=rc.addLineSeries({color:'#9b8bd6',lineWidth:2,priceLineVisible:false});
sRsi.createPriceLine({price:70,color:'#c8453d',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:''});
sRsi.createPriceLine({price:30,color:'#12876f',lineWidth:1,lineStyle:2,axisLabelVisible:true,title:''});
function colors(){cs.applyOptions({upColor:css('--up'),downColor:css('--down'),borderUpColor:css('--up'),borderDownColor:css('--down'),wickUpColor:css('--up'),wickDownColor:css('--down')});
 chart.applyOptions(themeOpts());rc.applyOptions(themeOpts())}
colors();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(colors,50));
let syncing=false;
const link=(a,b)=>a.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r&&!syncing){syncing=true;b.timeScale().setVisibleLogicalRange(r);syncing=false}});
link(chart,rc);link(rc,chart);

const on={sma:true,ema:false,bb:false,rsi:true};
function applyVis(){sSma.applyOptions({visible:on.sma});sEma.applyOptions({visible:on.ema});[bU,bM,bL].forEach(s=>s.applyOptions({visible:on.bb}));
 $('r').style.display=on.rsi?'block':'none';
 if(on.rsi)setTimeout(()=>{const r=chart.timeScale().getVisibleLogicalRange();if(r)rc.timeScale().setVisibleLogicalRange(r)},80)}
[['sma','Media 20'],['ema','Media 50'],['bb','Bollinger'],['rsi','RSI 14']].forEach(([k,n])=>{const b=document.createElement('button');b.className='chip'+(on[k]?' on':'');b.textContent=n;
 b.onclick=()=>{on[k]=!on[k];b.classList.toggle('on',on[k]);applyVis()};$('inds').appendChild(b)});
Object.keys(SEC).forEach(k=>{const b=document.createElement('button');b.className='chip'+(k===tf?' on':'');b.textContent=k;b.dataset.tf=k;
 b.onclick=()=>{tf=k;document.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('on',x.dataset.tf===k));load()};$('tfs').appendChild(b)});

/* Simulador */
let realized=0,pos=null,hist=[],events=[],line=null;
const price=()=>cands.length?cands[cands.length-1].close:0;
const bucket=s=>Math.floor((s-off)/SEC[tf])*SEC[tf]+off;
const msg=s=>{$('msg').textContent=s};
function drawMarkers(){cs.setMarkers(events.filter(e=>e.sym===sym).map(e=>({time:bucket(e.time),position:e.kind==='in'?(e.side>0?'belowBar':'aboveBar'):'inBar',
 color:e.kind==='in'?(e.side>0?css('--up'):css('--down')):css('--amber'),shape:e.kind==='in'?(e.side>0?'arrowUp':'arrowDown'):'circle',text:e.kind==='in'?(e.side>0?'Largo':'Corto'):'Salida'}))
 .sort((a,b)=>a.time-b.time))}
function drawLine(){if(line){cs.removePriceLine(line);line=null}if(pos&&pos.sym===sym)line=cs.createPriceLine({price:pos.entry,color:css('--amber'),lineWidth:1,lineStyle:2,axisLabelVisible:true,title:'Entrada'})}
const nowT=()=>Math.floor(Date.now()/1000)+off;
function unreal(){return pos&&pos.sym===sym?pos.side*(price()-pos.entry)*pos.qty:0}
function open(side){if(pos){msg('Ya tienes una posición abierta. Ciérrala primero.');return}
 const a=parseFloat($('amt').value),eq=parseFloat($('cap').value)+realized;
 if(!price()){msg('Esperando precios…');return}
 if(!(a>0)){msg('Escribe un monto válido.');return}if(a>eq){msg('El monto supera tu saldo disponible.');return}
 pos={sym,side,entry:price(),qty:a/price(),amount:a};events.push({time:nowT(),kind:'in',side,sym});msg('');drawMarkers();drawLine();render()}
function closePos(why){if(!pos)return;const ex=price(),pnl=pos.side*(ex-pos.entry)*pos.qty-pos.amount*0.001*2;
 realized+=pnl;hist.unshift({sym:pos.sym,side:pos.side,entry:pos.entry,exit:ex,pnl});events.push({time:nowT(),kind:'out',side:pos.side,sym:pos.sym});
 pos=null;msg(why||'');drawMarkers();drawLine();render()}
function render(){const u=unreal(),eq=parseFloat($('cap').value)+realized+u;
 $('eq').textContent='$'+fmt(eq);$('eq').className=eq>=parseFloat($('cap').value)?'up':'down';
 $('open').innerHTML=pos?(pos.side>0?'Largo ':'Corto ')+pos.sym.replace('USDT','')+' <span class="'+(u>=0?'up':'down')+'">'+(u>=0?'+':'')+fmt(u)+'</span>':'Ninguna';
 $('nt').textContent=hist.length;const w=hist.filter(h=>h.pnl>0).length;$('wr').textContent=hist.length?fmt(w/hist.length*100,0)+'%':'–';
 $('hist').innerHTML=hist.slice(0,5).map(h=>'<li><span>'+h.sym.replace('USDT','')+' '+(h.side>0?'Largo':'Corto')+' '+fmt(h.entry,dp(h.entry))+' → '+fmt(h.exit,dp(h.exit))+'</span><b class="'+(h.pnl>=0?'up':'down')+'">'+(h.pnl>=0?'+':'')+fmt(h.pnl)+'</b></li>').join('')}
$('buy').onclick=()=>open(1);$('sell').onclick=()=>open(-1);$('close').onclick=()=>{pos?closePos('Posición cerrada.'):msg('No hay posición abierta.')};
$('reset').onclick=()=>{realized=0;pos=null;hist=[];events=[];msg('Simulador reiniciado.');drawMarkers();drawLine();render()};
$('cap').oninput=render;
$('sym').onchange=e=>{if(pos){e.target.value=sym;msg('Cierra tu posición antes de cambiar de par.');return}sym=e.target.value;load()};

/* Dibujos (se guardan por par en el celular) */
let tool=null,pend=null,draws=[],objs=[];
const dkey=()=>'dib-'+sym;
function loadDraws(){try{draws=JSON.parse(localStorage.getItem(dkey())||'[]')}catch(e){draws=[]}}
function saveDraws(){try{localStorage.setItem(dkey(),JSON.stringify(draws))}catch(e){}}
function clearObjs(){objs.forEach(o=>{if(o.line)cs.removePriceLine(o.line);else chart.removeSeries(o.series)});objs=[]}
function drawAll(){clearObjs();draws.forEach(d=>{
 if(d.k==='h'){objs.push({line:cs.createPriceLine({price:d.p,color:'#e8618c',lineWidth:1,lineStyle:0,axisLabelVisible:true,title:''})});return}
 const a=bucket(d.t1+off),b=bucket(d.t2+off);if(a===b||!cands.length||a<cands[0].time)return;
 const s=chart.addLineSeries({color:'#3ec1d3',lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
 s.setData([{time:a,value:d.p1},{time:b,value:d.p2}]);objs.push({series:s})})}
function hint(){$('hint').textContent=tool==='h'?'Toca el gráfico donde quieras la línea.':tool==='t'?(pend?'Toca el segundo punto.':'Toca el primer punto.'):''}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{const t=b.dataset.tool;tool=tool===t?null:t;pend=null;
 document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x.dataset.tool===tool));hint()});
chart.subscribeClick(p=>{if(!tool||!p.point)return;const pr=cs.coordinateToPrice(p.point.y);if(pr==null)return;
 if(tool==='h'){draws.push({k:'h',p:pr});saveDraws();drawAll();return}
 if(!p.time){$('hint').textContent='Toca sobre las velas.';return}
 if(!pend){pend={t:p.time-off,p:pr};hint();return}
 let a=pend,b={t:p.time-off,p:pr};
 if(a.t===b.t){$('hint').textContent='Elige un punto en otra vela.';return}
 if(a.t>b.t){const x=a;a=b;b=x}
 draws.push({k:'t',t1:a.t,p1:a.p,t2:b.t,p2:b.p});pend=null;saveDraws();drawAll();hint()});
$('undo').onclick=()=>{draws.pop();saveDraws();drawAll()};
$('clr').onclick=()=>{if(draws.length&&confirm('¿Borrar todos los dibujos de este par?')){draws=[];saveDraws();drawAll()}};

/* Datos reales de Binance */
async function load(){const my=++loadId;if(ws)ws.close();status('Conectando…');
 try{const k=await api('/api/v3/klines?symbol='+sym+'&interval='+IV[tf]+'&limit=1000');if(my!==loadId)return;
  cands=k.map(x=>({time:x[0]/1000+off,open:+x[1],high:+x[2],low:+x[3],close:+x[4]}));
  const d=dp(price());cs.applyOptions({priceFormat:{type:'price',precision:d,minMove:1/Math.pow(10,d)}});
  cs.setData(cands);sSma.setData(sma(cands,20));sEma.setData(ema(cands,50));
  const b=bb(cands);bU.setData(b.u);bM.setData(b.mid);bL.setData(b.l);sRsi.setData(rsi(cands));
  const n=cands.length;chart.timeScale().setVisibleLogicalRange({from:n-90,to:n+6});applyVis();drawMarkers();drawLine();pend=null;hint();loadDraws();drawAll();
  $('price').textContent=fmt(price(),d);render();connect(my,0);loadTicker()}
 catch(e){if(my===loadId)status('No se pudo conectar a Binance. Revisa tu internet y recarga la página.',true)}}
function connect(my,i){if(my!==loadId)return;ws=new WebSocket(WSS[i%2]+sym.toLowerCase()+'@kline_'+IV[tf]);
 ws.onopen=()=>status('En vivo · Binance');
 ws.onmessage=e=>{if(my===loadId)onKline(JSON.parse(e.data).k)};
 ws.onclose=()=>{if(my===loadId){status('Reconectando…');setTimeout(()=>connect(my,i+1),2000)}}}
function onKline(k){const c={time:k.t/1000+off,open:+k.o,high:+k.h,low:+k.l,close:+k.c},l=cands[cands.length-1];
 if(c.time===l.time)cands[cands.length-1]=c;else if(c.time>l.time)cands.push(c);else return;
 cs.update(c);const tail=cands.slice(-400),la=a=>a[a.length-1];
 sSma.update(la(sma(tail,20)));sEma.update(la(ema(tail,50)));const b=bb(tail);bU.update(la(b.u));bM.update(la(b.mid));bL.update(la(b.l));sRsi.update(la(rsi(tail)));
 $('price').textContent=fmt(c.close,dp(c.close));
 if(pos&&pos.sym===sym){const r=pos.side*(c.close/pos.entry-1)*100,sl=parseFloat($('sl').value),tp=parseFloat($('tp').value);
  if(sl>0&&r<=-sl)closePos('Stop loss alcanzado.');else if(tp>0&&r>=tp)closePos('Take profit alcanzado.')}
 render()}
async function loadTicker(){try{const t=await api('/api/v3/ticker/24hr?symbol='+sym),ch=parseFloat(t.priceChangePercent);
 $('chg').textContent=(ch>=0?'+':'')+fmt(ch)+'%';$('chg').className=ch>=0?'up':'down'}catch(e){}}
setInterval(loadTicker,60000);
load();render();
</script>
</body>
</html>
